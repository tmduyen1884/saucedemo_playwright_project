name: Playwright Automated Tests CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép bấm nút chạy thủ công trên giao diện GitHub

jobs:
  playwright-tests:
    name: Run Test Suite on Ubuntu
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn dự án về máy chủ ảo của GitHub
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Python 3.11 với bộ đệm cache pip để tối ưu thời gian cài đặt
      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Bước 3: Nâng cấp pip và cài đặt toàn bộ thư viện từ requirements.txt
      - name: 3. Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bước 4: Tải trình duyệt Chromium kèm theo các thư viện OS bắt buộc của Linux Ubuntu (--with-deps)
      - name: 4. Install Playwright browser & system dependencies
        run: |
          playwright install --with-deps chromium

      # Bước 5: Thực thi kiểm thử Pytest và xuất báo cáo Allure
      - name: 5. Run Playwright Pytest suite
        run: |
          pytest tests/ -v --tracing=retain-on-failure --screenshot=only-on-failure --alluredir=allure-results

      # Bước 6: Đẩy thư mục kết quả Allure lên mục Artifacts trên GitHub (luôn chạy kể cả test fail)
      - name: 6. Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      # Bước 7: Nếu có bài test bị FAILED, tự động đính kèm file trace.zip và screenshot lên GitHub để tải về gỡ lỗi
      - name: 7. Upload Failure Traces and Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-traces-and-screenshots
          path: test-results/
          retention-days: 14
